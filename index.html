<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048-合成大福一 by Frederick123</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'neon-pink': '#ff2a6d',
                        'neon-blue': '#05d9e8',
                        'neon-purple': '#d300c5',
                        'neon-green': '#00ff9f',
                        'neon-yellow': '#fee715',
                        'neon-orange': '#ff6e00',
                        'dark-bg': '#0d0221',
                        'dark-panel': '#1a0b2e',
                        'dark-cell': '#2a1b3d',
                    },
                    fontFamily: {
                        'display': ['Poppins', 'sans-serif'],
                    },
                    animation: {
                        'spawn': 'spawn 0.2s ease-out',
                        'merge': 'merge 0.2s ease-out',
                        'pulse-glow': 'pulse-glow 2s ease-in-out infinite',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0d0221 0%, #1a0b2e 50%, #2a1b3d 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated background particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.3;
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            25% { transform: translateY(-30px) translateX(20px); }
            50% { transform: translateY(20px) translateX(-15px); }
            75% { transform: translateY(-10px) translateX(25px); }
        }

        /* Glassmorphism panels */
        .glass-panel {
            background: rgba(26, 11, 46, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(5, 217, 232, 0.2);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* Neon glow effects */
        .neon-text-pink {
            color: #ff2a6d;
            text-shadow: 
                0 0 5px #ff2a6d,
                0 0 10px #ff2a6d,
                0 0 20px #ff2a6d,
                0 0 40px #ff2a6d;
        }

        .neon-text-blue {
            color: #05d9e8;
            text-shadow: 
                0 0 5px #05d9e8,
                0 0 10px #05d9e8,
                0 0 20px #05d9e8,
                0 0 40px #05d9e8;
        }

        .neon-border {
            border: 2px solid rgba(5, 217, 232, 0.5);
            box-shadow: 
                0 0 10px rgba(5, 217, 232, 0.3),
                inset 0 0 10px rgba(5, 217, 232, 0.1);
        }

        /* Game container */
        .game-container {
            background: rgba(13, 2, 33, 0.8);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(5, 217, 232, 0.3);
            box-shadow: 
                0 0 30px rgba(5, 217, 232, 0.2),
                0 0 60px rgba(255, 42, 109, 0.1),
                inset 0 0 20px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .grid-cell {
            background: rgba(42, 27, 61, 0.6);
            border: 1px solid rgba(5, 217, 232, 0.1);
            border-radius: 12px;
        }

        /* Tile styles with neon glow */
        .tile {
            position: absolute;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
            overflow: hidden;
        }

        .tile-2 {
            background: linear-gradient(135deg, #1a0b2e, #2a1b3d);
            border: 2px solid #05d9e8;
            box-shadow: 0 0 15px rgba(5, 217, 232, 0.4), inset 0 0 10px rgba(5, 217, 232, 0.1);
        }
        .tile-4 {
            background: linear-gradient(135deg, #1a0b2e, #2a1b3d);
            border: 2px solid #00ff9f;
            box-shadow: 0 0 15px rgba(0, 255, 159, 0.4), inset 0 0 10px rgba(0, 255, 159, 0.1);
        }
        .tile-8 {
            background: linear-gradient(135deg, #1a0b2e, #2a1b3d);
            border: 2px solid #fee715;
            box-shadow: 0 0 15px rgba(254, 231, 21, 0.4), inset 0 0 10px rgba(254, 231, 21, 0.1);
        }
        .tile-16 {
            background: linear-gradient(135deg, #1a0b2e, #2a1b3d);
            border: 2px solid #ff6e00;
            box-shadow: 0 0 15px rgba(255, 110, 0, 0.4), inset 0 0 10px rgba(255, 110, 0, 0.1);
        }
        .tile-32 {
            background: linear-gradient(135deg, #1a0b2e, #2a1b3d);
            border: 2px solid #ff2a6d;
            box-shadow: 0 0 15px rgba(255, 42, 109, 0.4), inset 0 0 10px rgba(255, 42, 109, 0.1);
        }
        .tile-64 {
            background: linear-gradient(135deg, #2a1b3d, #3d2b50);
            border: 2px solid #d300c5;
            box-shadow: 0 0 20px rgba(211, 0, 197, 0.5), inset 0 0 15px rgba(211, 0, 197, 0.15);
        }
        .tile-128 {
            background: linear-gradient(135deg, #2a1b3d, #3d2b50);
            border: 2px solid #05d9e8;
            box-shadow: 0 0 25px rgba(5, 217, 232, 0.6), inset 0 0 15px rgba(5, 217, 232, 0.2);
        }
        .tile-256 {
            background: linear-gradient(135deg, #2a1b3d, #3d2b50);
            border: 2px solid #00ff9f;
            box-shadow: 0 0 25px rgba(0, 255, 159, 0.6), inset 0 0 15px rgba(0, 255, 159, 0.2);
        }
        .tile-512 {
            background: linear-gradient(135deg, #2a1b3d, #3d2b50);
            border: 2px solid #fee715;
            box-shadow: 0 0 25px rgba(254, 231, 21, 0.6), inset 0 0 15px rgba(254, 231, 21, 0.2);
        }
        .tile-1024 {
            background: linear-gradient(135deg, #2a1b3d, #3d2b50);
            border: 2px solid #ff2a6d;
            box-shadow: 0 0 30px rgba(255, 42, 109, 0.7), inset 0 0 20px rgba(255, 42, 109, 0.25);
        }
        .tile-2048 {
            background: linear-gradient(135deg, #3d2b50, #4d3b60);
            border: 2px solid #d300c5;
            box-shadow: 0 0 35px rgba(211, 0, 197, 0.8), inset 0 0 25px rgba(211, 0, 197, 0.3);
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { 
                box-shadow: 0 0 35px rgba(211, 0, 197, 0.8), inset 0 0 25px rgba(211, 0, 197, 0.3);
            }
            50% { 
                box-shadow: 0 0 50px rgba(211, 0, 197, 1), inset 0 0 35px rgba(211, 0, 197, 0.4);
            }
        }

        /* Tile animations */
        @keyframes spawn {
            0% { transform: scale(0) rotate(180deg); opacity: 0; }
            50% { transform: scale(1.1) rotate(0deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes merge {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); filter: brightness(1.5); }
            100% { transform: scale(1); filter: brightness(1); }
        }

        .tile-spawn {
            animation: spawn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .tile-merge {
            animation: merge 0.2s ease-out;
        }

        /* Tile image styling */
        .tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
            opacity: 0.85;
        }

        /* Score panel */
        .score-panel {
            background: rgba(26, 11, 46, 0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(5, 217, 232, 0.3);
            box-shadow: 0 0 20px rgba(5, 217, 232, 0.2);
        }

        /* Game over overlay */
        .game-over-overlay {
            background: rgba(13, 2, 33, 0.85);
            backdrop-filter: blur(10px);
        }

        /* Button styles */
        .neon-btn {
            background: rgba(5, 217, 232, 0.1);
            border: 2px solid #05d9e8;
            color: #05d9e8;
            text-shadow: 0 0 10px #05d9e8;
            box-shadow: 0 0 15px rgba(5, 217, 232, 0.3), inset 0 0 10px rgba(5, 217, 232, 0.1);
            transition: all 0.3s ease;
        }

        .neon-btn:hover {
            background: rgba(5, 217, 232, 0.2);
            box-shadow: 0 0 25px rgba(5, 217, 232, 0.6), inset 0 0 15px rgba(5, 217, 232, 0.2);
            transform: translateY(-2px);
        }

        .neon-btn:active {
            transform: translateY(0);
        }

        /* Scanline effect */
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #05d9e8, transparent);
            animation: scan 4s linear infinite;
            opacity: 0.3;
            pointer-events: none;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        /* Title glow animation */
        @keyframes title-glow {
            0%, 100% {
                text-shadow: 
                    0 0 10px #ff2a6d,
                    0 0 20px #ff2a6d,
                    0 0 40px #ff2a6d;
            }
            50% {
                text-shadow: 
                    0 0 15px #05d9e8,
                    0 0 25px #05d9e8,
                    0 0 50px #05d9e8;
            }
        }

        .title-glow {
            animation: title-glow 3s ease-in-out infinite;
        }

        /* Responsive */
        @media (max-width: 500px) {
            .game-container {
                width: 100%;
                max-width: 400px;
                height: 400px;
            }
            .tile {
                width: calc((100% - 45px) / 4);
                height: calc((100% - 45px) / 4);
            }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 min-h-screen">
    <!-- Animated background particles -->
    <div class="particles" id="particles"></div>

    <div class="container relative z-10 w-full max-w-md">
        <!-- Header -->
        <div class="header flex justify-between items-center mb-6">
            <h1 class="text-3xl md:text-4xl font-extrabold neon-text-pink title-glow">
                2048
            </h1>
            <div class="flex gap-3">
                <div class="score-panel rounded-xl px-4 py-2">
                    <div class="text-xs uppercase tracking-wider text-neon-blue font-semibold">分数</div>
                    <div class="text-2xl font-bold text-white" id="score">0</div>
                </div>
                <div class="score-panel rounded-xl px-4 py-2">
                    <div class="text-xs uppercase tracking-wider text-neon-pink font-semibold">最高</div>
                    <div class="text-2xl font-bold text-white" id="best">0</div>
                </div>
            </div>
        </div>

        <!-- Subtitle -->
        <div class="text-center mb-4">
            <p class="text-neon-blue text-sm font-semibold tracking-wide">合成大福一 by Frederick123</p>
        </div>

        <!-- Game container -->
        <div class="game-container rounded-2xl p-4 mx-auto" style="width: 450px; height: 450px;">
            <div class="scanline"></div>
            <div class="grid-container grid grid-cols-4 grid-rows-4 gap-3 w-full h-full" id="grid-container"></div>
            
            <!-- Game over overlay -->
            <div class="game-over-overlay absolute inset-0 z-50 flex-col items-center justify-center rounded-2xl hidden" id="game-over">
                <div class="text-5xl font-extrabold neon-text-pink mb-6">游戏结束!</div>
                <button class="neon-btn px-8 py-3 rounded-xl font-bold text-lg" onclick="resetGame()">
                    <i class="fas fa-redo mr-2"></i>再玩一次
                </button>
            </div>

            <!-- Win overlay -->
            <div class="game-over-overlay absolute inset-0 z-50 flex-col items-center justify-center rounded-2xl hidden" id="game-win">
                <div class="text-5xl font-extrabold neon-text-blue mb-6">恭喜通关!</div>
                <button class="neon-btn px-8 py-3 rounded-xl font-bold text-lg" onclick="continueGame()">
                    <i class="fas fa-arrow-right mr-2"></i>继续游戏
                </button>
            </div>
        </div>

        <!-- Controls info -->
        <div class="mt-6 glass-panel rounded-xl p-4">
            <div class="flex justify-around items-center text-neon-blue">
                <div class="text-center">
                    <i class="fas fa-arrow-up text-2xl mb-1"></i>
                    <div class="text-xs">上</div>
                </div>
                <div class="text-center">
                    <i class="fas fa-arrow-down text-2xl mb-1"></i>
                    <div class="text-xs">下</div>
                </div>
                <div class="text-center">
                    <i class="fas fa-arrow-left text-2xl mb-1"></i>
                    <div class="text-xs">左</div>
                </div>
                <div class="text-center">
                    <i class="fas fa-arrow-right text-2xl mb-1"></i>
                    <div class="text-xs">右</div>
                </div>
            </div>
            <div class="text-center mt-3 text-xs text-gray-400">
                使用方向键控制 · 相同数字合并 · 目标2048
            </div>
        </div>

        <!-- New Game Button -->
        <div class="mt-4 text-center">
            <button class="neon-btn px-8 py-3 rounded-xl font-bold text-lg w-full" onclick="resetGame()">
                <i class="fas fa-redo mr-2"></i>新游戏
            </button>
        </div>
    </div>

    <script>
        // Create background particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const colors = ['#ff2a6d', '#05d9e8', '#d300c5', '#00ff9f', '#fee715'];
            
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 4 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            createParticles();
            initGame();
            document.addEventListener('keydown', handleKeyPress);
            
            // Touch support
            let touchStartX = 0;
            let touchStartY = 0;
            
            document.querySelector('.game-container').addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            });
            
            document.querySelector('.game-container').addEventListener('touchend', (e) => {
                if (gameOver) return;
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;
                const dx = touchEndX - touchStartX;
                const dy = touchEndY - touchStartY;
                
                let moved = false;
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx > 30) moved = moveRight();
                    else if (dx < -30) moved = moveLeft();
                } else {
                    if (dy > 30) moved = moveDown();
                    else if (dy < -30) moved = moveUp();
                }
                
                if (moved) {
                    addRandomTile();
                    renderBoard();
                    checkGameState();
                }
            });
        });

        // ---------- 数字 → 图片路径映射 (保持不变) ----------
        function getImage(value) {
            const map = {
                2: '2.png',
                4: '4.png',
                8: '8.png',
                16: '16.png',
                32: '32.png',
                64: '64.png',
                128: '128.png',
                256: '256.png',
                512: '512.png',
                1024: '1024.png',
                2048: '2048.png'
            };
            return map[value] || '';
        }

        let grid = [];
        let score = 0;
        let best = parseInt(localStorage.getItem('best2048') || '0');
        let gameOver = false;
        let won = false;
        let mergedTiles = new Set();

        function initGame() {
            grid = Array(4).fill().map(() => Array(4).fill(0));
            score = 0;
            gameOver = false;
            won = false;
            mergedTiles.clear();
            document.getElementById('score').textContent = score;
            document.getElementById('best').textContent = best;
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('game-win').style.display = 'none';
            const gridContainer = document.getElementById('grid-container');
            gridContainer.innerHTML = '';
            for (let i = 0; i < 16; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                gridContainer.appendChild(cell);
            }
            addRandomTile();
            addRandomTile();
            renderBoard(true);
        }

        function addRandomTile() {
            if (gameOver) return;
            const emptyCells = [];
            for (let row = 0; row < 4; row++) {
                for (let col = 0; col < 4; col++) {
                    if (grid[row][col] === 0) emptyCells.push({ row, col });
                }
            }
            if (emptyCells.length > 0) {
                const { row, col } = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                grid[row][col] = Math.random() < 0.9 ? 2 : 4;
                return { row, col };
            }
            return null;
        }

        function renderBoard(isInit = false) {
            // Remove old tiles
            document.querySelectorAll('.tile').forEach(tile => tile.remove());
            mergedTiles.clear();

            for (let row = 0; row < 4; row++) {
                for (let col = 0; col < 4; col++) {
                    const value = grid[row][col];
                    if (value !== 0) {
                        const tile = document.createElement('div');
                        tile.className = `tile tile-${value}`;
                        
                        // Calculate position
                        const cellSize = 97.5;
                        const gap = 15;
                        tile.style.width = cellSize + 'px';
                        tile.style.height = cellSize + 'px';
                        tile.style.top = `${row * (cellSize + gap) + 15}px`;
                        tile.style.left = `${col * (cellSize + gap) + 15}px`;

                        // Add spawn animation for new tiles
                        if (isInit || (row === lastSpawn?.row && col === lastSpawn?.col)) {
                            tile.classList.add('tile-spawn');
                        }

                        // Insert image
                        const img = document.createElement('img');
                        img.src = getImage(value);
                        img.alt = value;
                        img.onerror = function() {
                            this.style.display = 'none';
                            tile.textContent = value;
                            tile.style.color = '#fff';
                            tile.style.fontWeight = 'bold';
                            tile.style.fontSize = value > 999 ? '20px' : '28px';
                        };
                        tile.appendChild(img);

                        document.querySelector('.game-container').appendChild(tile);
                    }
                }
            }
            document.getElementById('score').textContent = score;
            if (score > best) {
                best = score;
                localStorage.setItem('best2048', best);
                document.getElementById('best').textContent = best;
            }
        }

        let lastSpawn = null;

        function handleKeyPress(event) {
            if (gameOver) return;
            let moved = false;
            switch (event.key) {
                case 'ArrowUp': moved = moveUp(); break;
                case 'ArrowDown': moved = moveDown(); break;
                case 'ArrowLeft': moved = moveLeft(); break;
                case 'ArrowRight': moved = moveRight(); break;
                default: return;
            }
            if (moved) {
                event.preventDefault();
                lastSpawn = addRandomTile();
                renderBoard();
                checkGameState();
            }
        }

        function checkGameState() {
            if (isGameOver()) {
                gameOver = true;
                setTimeout(() => {
                    document.getElementById('game-over').style.display = 'flex';
                }, 300);
            }
            // Check for win
            for (let row = 0; row < 4; row++) {
                for (let col = 0; col < 4; col++) {
                    if (grid[row][col] === 2048 && !won) {
                        won = true;
                        setTimeout(() => {
                            document.getElementById('game-win').style.display = 'flex';
                        }, 300);
                        return;
                    }
                }
            }
        }

        function continueGame() {
            document.getElementById('game-win').style.display = 'none';
        }

        function moveUp() {
            let moved = false;
            for (let col = 0; col < 4; col++) {
                for (let row = 1; row < 4; row++) {
                    if (grid[row][col] !== 0) {
                        let currentRow = row;
                        while (currentRow > 0) {
                            if (grid[currentRow - 1][col] === 0) {
                                grid[currentRow - 1][col] = grid[currentRow][col];
                                grid[currentRow][col] = 0;
                                currentRow--;
                                moved = true;
                            } else if (grid[currentRow - 1][col] === grid[currentRow][col]) {
                                grid[currentRow - 1][col] *= 2;
                                score += grid[currentRow - 1][col];
                                grid[currentRow][col] = 0;
                                moved = true;
                                break;
                            } else {
                                break;
                            }
                        }
                    }
                }
            }
            return moved;
        }

        function moveDown() {
            let moved = false;
            for (let col = 0; col < 4; col++) {
                for (let row = 2; row >= 0; row--) {
                    if (grid[row][col] !== 0) {
                        let currentRow = row;
                        while (currentRow < 3) {
                            if (grid[currentRow + 1][col] === 0) {
                                grid[currentRow + 1][col] = grid[currentRow][col];
                                grid[currentRow][col] = 0;
                                currentRow++;
                                moved = true;
                            } else if (grid[currentRow + 1][col] === grid[currentRow][col]) {
                                grid[currentRow + 1][col] *= 2;
                                score += grid[currentRow + 1][col];
                                grid[currentRow][col] = 0;
                                moved = true;
                                break;
                            } else {
                                break;
                            }
                        }
                    }
                }
            }
            return moved;
        }

        function moveLeft() {
            let moved = false;
            for (let row = 0; row < 4; row++) {
                for (let col = 1; col < 4; col++) {
                    if (grid[row][col] !== 0) {
                        let currentCol = col;
                        while (currentCol > 0) {
                            if (grid[row][currentCol - 1] === 0) {
                                grid[row][currentCol - 1] = grid[row][currentCol];
                                grid[row][currentCol] = 0;
                                currentCol--;
                                moved = true;
                            } else if (grid[row][currentCol - 1] === grid[row][currentCol]) {
                                grid[row][currentCol - 1] *= 2;
                                score += grid[row][currentCol - 1];
                                grid[row][currentCol] = 0;
                                moved = true;
                                break;
                            } else {
                                break;
                            }
                        }
                    }
                }
            }
            return moved;
        }

        function moveRight() {
            let moved = false;
            for (let row = 0; row < 4; row++) {
                for (let col = 2; col >= 0; col--) {
                    if (grid[row][col] !== 0) {
                        let currentCol = col;
                        while (currentCol < 3) {
                            if (grid[row][currentCol + 1] === 0) {
                                grid[row][currentCol + 1] = grid[row][currentCol];
                                grid[row][currentCol] = 0;
                                currentCol++;
                                moved = true;
                            } else if (grid[row][currentCol + 1] === grid[row][currentCol]) {
                                grid[row][currentCol + 1] *= 2;
                                score += grid[row][currentCol + 1];
                                grid[row][currentCol] = 0;
                                moved = true;
                                break;
                            } else {
                                break;
                            }
                        }
                    }
                }
            }
            return moved;
        }

        function isGameOver() {
            for (let row = 0; row < 4; row++) {
                for (let col = 0; col < 4; col++) {
                    if (grid[row][col] === 0) return false;
                    if (col < 3 && grid[row][col + 1] === grid[row][col]) return false;
                    if (row < 3 && grid[row + 1][col] === grid[row][col]) return false;
                }
            }
            return true;
        }

        function resetGame() { initGame(); }
    </script>
